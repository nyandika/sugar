apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "com.example"
        minSdkVersion 14
        targetSdkVersion 34
        compileSdk 34
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
    }
    namespace 'com.example'
}

dependencies {
    implementation project (':library')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
