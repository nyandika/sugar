apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "com.example"
        minSdk 21
        targetSdk 36
        compileSdk 36
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
    }
    namespace 'com.example'
}

dependencies {
    implementation project (':library')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
