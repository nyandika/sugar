apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    defaultConfig {
        minSdkVersion 21
        targetSdk 36
        compileSdk 36
        versionCode 10
        versionName "1.6.2"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
    }

    namespace 'com.orm.dsl'

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    testCoverage.jacocoVersion = "0.8.11"
}

def githubProperties = new Properties()
def githubPropertiesFile = rootProject.file("github.properties")
if (githubPropertiesFile.exists()) {
    githubProperties.load(new FileInputStream(githubPropertiesFile))
}

def gprUser = (githubProperties['gpr.usr'] ?: System.getenv("GPR_USER"))?.toString()
def gprKey = (githubProperties['gpr.key'] ?: System.getenv("GPR_API_KEY"))?.toString()

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

publishing {
    publications {
        release(MavenPublication) {
            group 'com.github.nyandika'
            artifactId 'sugar'
            version android.defaultConfig.versionName

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/nyandika/sugar")

            credentials {
                // Gradle 9 validates these as required; set explicit fallback values.
                username = gprUser ?: ""
                password = gprKey ?: ""
            }
        }
    }
}

tasks.matching { it.name == "publishReleasePublicationToGitHubPackagesRepository" }.configureEach {
    onlyIf {
        def hasCreds = gprUser && gprKey
        if (!hasCreds) {
            logger.lifecycle("Skipping GitHub Packages publish: set GPR_USER and GPR_API_KEY (or github.properties gpr.usr/gpr.key).")
        }
        return hasCreds
    }
}
